description: >-
    Local-first Go job-search toolkit (single binary, v0.9.0). JobKit combines a
    trusted YAML profile, explainable eligibility policy, saved board searches,
    company and referral intelligence, a deduplicated inbox, JD parsing,
    deterministic fit scoring, tailored resumes and letters, human-reviewed
    apply packages, and an append-only application tracker. Its evidence-linked
    interview coach builds role-specific project, behavioral, system-design,
    and claim-defense drills from reviewed public source bundles. Deterministic
    scoring, claim gates, spaced review, and localhost practice remain
    authoritative; optional model feedback is advisory. Synthetic public
    fixtures and private local state stay separate. Every JD argument accepts a
    file, supported URL, or browser handoff. Agent output uses stable JSON
    envelopes and per-run telemetry, and the demo runs in an isolated
    JOBKIT_HOME.
