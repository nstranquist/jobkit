description: Multi-purpose job application & resume toolkit (Go, single binary, v0.8.0). Master YAML profile with trusted resume bootstrap → explainable eligibility policy in ~/.jobkit/eligibility.yaml that keeps geography/language/years/work-mode/travel/role-family hard constraints separate from fit and opportunity → saved board groups/search profiles plus curated target packs and digest runs → hidden-market company intelligence in ~/.jobkit/companies.yaml with ATS boards, target compensation, and dated hiring signals → contacts/referrals append-only ledger in ~/.jobkit/contacts.jsonl linked to inbox items and tracker IDs → public board search over Greenhouse/Lever/Ashby company boards with partial-result warnings by default, `--strict` fail-fast mode, extracted compensation, freshness, saturation, persona scoring, `--sort opportunity|comp|freshness`, `--min-comp` filters, and outcome-calibrated active weights from ~/.jobkit/calibration.yaml via `jobkit calibrate report|apply` → deduped inbox queue with eligibility receipts, fit scores, next actions, score/source/last-seen provenance, append-only reassessment, deterministic 5/3/1/1 weekly slates capped at two roles per employer, outreach drafts, and human-reviewed form-fill packets → JD parsing against an embedded 150-entry skills lexicon (longest-match span dedup, requirements-section 2x weighting, per-skill cap) → 0-100 gap score with evidence classes → fail-closed human-in-loop apply plans (resume, letter, outreach, form-fill JSON, prep, match and eligibility receipts, JD, checklist; no form auto-submit) → JD-tailored resumes (markdown / ATS text / print-ready HTML / PDF via headless Chrome) → deterministic cover letters citing real bullets → interview-prep sheets (deep-dives anchored to own bullets, gap-defense bridges, STAR bank) → append-only JSONL application tracker (board/stats/followups/reminder export). `jobkit apply <jd|url>` writes the full package to ~/.jobkit/out/<id>/ and tracks its fit plus eligibility provenance; every <jd> arg accepts a live posting URL or browser-extracted JD handoff from `ndev browser job-posting --jobkit-apply`. Agent envelope {ok,data|error} with stable exit codes; per-run telemetry; JOBKIT_HOME-isolated demo.
