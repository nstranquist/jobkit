name: Feature request
description: Propose a focused improvement to JobKit.
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the proposed implementation. Do not include private job-search data.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this change, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the observable result you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain a possible command, workflow, or interface if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or smaller options.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: This request does not include private job-search data.
          required: true
        - label: I agree to follow the JobKit Code of Conduct.
          required: true
