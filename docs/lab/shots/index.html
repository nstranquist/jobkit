<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobKit docs lab — screenshot compare</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --line:#262d3a; --text:#c9d1d9; --strong:#f0f6fc; --muted:#8b949e; --accent:#79c0ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
  header { padding:28px 28px 8px; max-width:1400px; margin:0 auto; }
  h1 { color:var(--strong); font-size:28px; margin:0 0 8px; }
  .lede { color:var(--muted); max-width:78ch; }
  h2 { color:var(--strong); font-size:18px; margin:28px 0 10px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:12px; max-width:1400px; margin:0 auto 12px; padding:0 28px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  figcaption { padding:8px 12px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); }
  figcaption strong { color:var(--strong); }
  img { display:block; width:100%; height:auto; background:#000; }
  .score { font-family:ui-monospace,Menlo,monospace; color:var(--accent); }
  a { color:var(--accent); }
</style>
</head>
